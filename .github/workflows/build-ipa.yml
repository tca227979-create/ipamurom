name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge split library files
        run: |
          cd Libraries
          rm -f libiPhone-lib.a
          for i in {0..4}; do
            cat "libiPhone-lib.a.part$i" >> libiPhone-lib.a
          done
          rm -f libiPhone-lib.a.part*
          ls -lh libiPhone-lib.a
          cd ..

      - name: Fix IL2CPP architecture paths for Apple Silicon runner
        run: |
          cd Il2CppOutputProject/IL2CPP/build
          if [ -d "deploy_x86_64" ] && [ ! -d "deploy_arm64" ]; then
            cp -r deploy_x86_64 deploy_arm64
          fi
          if [ -d "deploy_arm64/bee_backend/mac-x64" ]; then
            mkdir -p deploy_arm64/bee_backend/mac-arm64
            cp -r deploy_arm64/bee_backend/mac-x64/* deploy_arm64/bee_backend/mac-arm64/ 2>/dev/null || true
          fi
          cd ../../..

      - name: Build Xcode Project
        run: |
          rm -rf build Payload
          mkdir -p build
          xcodebuild -project Unity-iPhone.xcodeproj \
                     -scheme Unity-iPhone \
                     -configuration Release \
                     -sdk iphoneos \
                     CONFIGURATION_BUILD_DIR="$PWD/build" \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=YES \
                     CODE_SIGNING_ALLOWED=YES \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     build

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/*.app Payload/
          zip -r -q Unity-iPhone.ipa Payload
          ls -lh Unity-iPhone.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-iPhone-IPA
          path: Unity-iPhone.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: iOS IPA Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: Unity-iPhone.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
